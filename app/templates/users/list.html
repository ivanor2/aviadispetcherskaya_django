{% extends 'base.html' %}
{% block title %}Управление пользователями{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Пользователи системы</h1>
</div>
<div class="cards-grid-single">
    {% if users %}
    {% for user in users %}
    <article class="user-card-single">
        <div class="user-card-single-content">
            <div class="user-card-single-main">
                <span class="user-name"><strong>{{ user.username }}</strong></span>
                <span class="user-role-badge">{{ user.role|upper }}</span>
            </div>
        </div>
        <div class="user-card-single-actions">
            <a href="{% url 'app:user_edit' user.id %}" class="btn btn-sm btn-primary">Изменить роль</a>
        </div>
    </article>
    {% endfor %}
    {% else %}
    <p class="empty-state">Пользователи не найдены</p>
    {% endif %}
</div>
{% endblock %}
