{% extends 'base.html' %}
{% block title %}Редактирование пользователя{% endblock %}
{% block content %}
<div class="form-container">
    <h2> Изменение роли пользователя</h2>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="form-group">
            {{ form.role.label_tag }}
            {{ form.role }}
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Сохранить</button>
            <a href="{% url 'app:user_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
